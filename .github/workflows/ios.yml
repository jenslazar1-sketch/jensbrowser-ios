name: ios-build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild \
            -project J3nsBrowser.xcodeproj \
            -scheme J3nsBrowser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/J3nsBrowser.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: Package unsigned IPA
        run: |
          APP=$(ls -d build/J3nsBrowser.xcarchive/Products/Applications/*.app | head -1)
          echo "app: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry J3nsBrowser-unsigned.ipa Payload
          ls -la J3nsBrowser-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: J3nsBrowser-unsigned-ipa
          path: J3nsBrowser-unsigned.ipa

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: J3nsBrowser-unsigned.ipa
