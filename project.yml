name: J3nsBrowser
options:
  bundleIdPrefix: com.j3nsontop
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  J3nsBrowser:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Generated-Info.plist
      properties:
        CFBundleDisplayName: J3NSONTOP
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        # J3NSONTOP Browser is a cleartext-opt-in browser, like the Android build.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "Web pages you visit can request camera access."
        NSMicrophoneUsageDescription: "Web pages you visit can request microphone access."
        NSPhotoLibraryUsageDescription: "Used when a web page opens a file picker."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.j3nsontop.browser
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  J3nsBrowser:
    build:
      targets:
        J3nsBrowser: all
    run:
      config: Debug
    archive:
      config: Release
